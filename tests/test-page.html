<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Browser Agent Content Test</title>
  <style>body { font-family: monospace; background: #111; color: #cdd6f4; padding: 16px; }</style>
</head>
<body>
  <div id="modal-box" style="position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:10;">
    <div style="background:#222; padding:20px; border-radius:8px;">
      <button id="modal-close" onclick="window.__modalClosed=(window.__modalClosed||0)+1;document.getElementById('modal-box').style.display='none'">关闭</button>
    </div>
  </div>
  <button id="btn-behind-modal" onclick="window.__behindModalClicks=(window.__behindModalClicks||0)+1">弹窗背后的按钮</button>
  <h1>content 逻辑浏览器测试</h1>
  <button id="btn-login" onclick="window.__clicked=(window.__clicked||0)+1;window.__clickedAt=(window.__clickedAt||0)+1">登录</button>
  <label for="input-search">搜索</label>
  <input id="input-search" type="text" placeholder="输入关键词">
  <a id="link-home" href="#home">首页</a>
  <div id="box-editor" contenteditable="true">hello</div>
  <label><input id="chk-remember" type="checkbox">记住我</label>
  <hr>
  <form id="login-form" onsubmit="window.__ffSubmitted=(window.__ffSubmitted||0)+1; return false;">
    <label for="ff-username">用户名</label>
    <input id="ff-username" type="text" name="username" placeholder="请输入用户名">
    <label for="ff-password">密码</label>
    <input id="ff-password" type="password" name="password" placeholder="请输入密码">
    <label for="ff-city">城市</label>
    <select id="ff-city" name="city">
      <option value="" selected disabled>请选择城市</option>
      <option value="sh">上海</option>
      <option value="bj">北京</option>
    </select>
    <label><input id="ff-agree" type="checkbox" name="agree"> 同意条款</label>
    <button id="ff-submit" type="submit">登录</button>
  </form>
  <form id="second-form" onsubmit="window.__ffSubmitted2=(window.__ffSubmitted2||0)+1; return false;">
    <label for="sf-email">邮箱</label>
    <input id="sf-email" type="email" name="email" placeholder="请输入邮箱">
    <button id="sf-ok" type="button">OK</button>
    <button id="sf-submit" type="submit">提交</button>
  </form>
  <div id="shadow-host"></div>
  <div id="nested-shadow-host"></div>
  <div id="shadow-form-host"></div>
  <div id="results"></div>
  <label for="input-captcha">验证码</label>
  <input id="input-captcha" type="text" placeholder="请输入验证码">
  <canvas id="captcha-canvas" width="120" height="50" style="border:1px solid #666; cursor:pointer; display:block;" onclick="window.__captchaClicks=(window.__captchaClicks||0)+1"></canvas>
  <!-- Vision-fallback test target: visible + clickable but NOT interactive per
       INTERACTIVE_SELECTOR (no onclick/role/button tag), so the DOM snapshot
       never lists it and the vision_locate recovery path must find it by sight.
       Uses addEventListener('pointerdown') so it stays out of the snapshot but
       still records real clicks for verification. -->
  <div id="vision-target" data-vision-test style="margin-top:40px; padding:14px 22px; display:inline-block; border:2px solid #f38ba8; border-radius:8px; color:#f38ba8; cursor:pointer;">视觉兜底目标</div>
  <!-- Same-origin iframe: its interactive elements must appear in the snapshot
       and be operable via framePath (cross-document location) from the main
       frame's content script. -->
  <iframe id="frame-box" srcdoc="<!DOCTYPE html><html><body><button id='frame-btn' onclick='window.__frameClicks=(window.__frameClicks||0)+1'>iframe按钮</button><input id='frame-input' type='text' placeholder='iframe输入框'></body></html>" style="margin-top:16px; width:320px; height:120px; border:1px solid #89b4fa;"></iframe>

  <script>
    (function () {
      const host = document.getElementById("shadow-host");
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML =
        '<button id="shadow-btn" onclick="window.__shadowClicks=(window.__shadowClicks||0)+1">幽灵按钮</button>' +
        '<input id="shadow-input" type="text" placeholder="shadow输入框">';
      const vt = document.getElementById("vision-target");
      if (vt) vt.addEventListener("pointerdown", () => { window.__visionClicks = (window.__visionClicks || 0) + 1; });
      // nested shadow: outer open root → inner open root → button/input (3 levels)
      const nestHost = document.getElementById("nested-shadow-host");
      const nestRoot = nestHost.attachShadow({ mode: "open" });
      const innerHost = document.createElement("div");
      innerHost.id = "shadow-inner-host";
      nestRoot.appendChild(innerHost);
      const innerRoot = innerHost.attachShadow({ mode: "open" });
      innerRoot.innerHTML =
        '<input id="nested-input" type="text" placeholder="嵌套shadow输入框">' +
        '<button id="nested-btn" onclick="window.__nestedClicks=(window.__nestedClicks||0)+1">嵌套幽灵按钮</button>';
      // shadow form: form + username/password + checkbox + submit inside one root
      const formHost = document.getElementById("shadow-form-host");
      const formRoot = formHost.attachShadow({ mode: "open" });
      formRoot.innerHTML =
        '<form id="shadow-form" onsubmit="window.__shadowFormSubmitted=(window.__shadowFormSubmitted||0)+1; return false;">' +
        '<label for="sf2-username">用户名</label>' +
        '<input id="sf2-username" type="text" name="username" placeholder="shadow用户名">' +
        '<label for="sf2-password">密码</label>' +
        '<input id="sf2-password" type="password" name="password" placeholder="shadow密码">' +
        '<label><input id="sf2-agree" type="checkbox" name="agree"> 同意shadow</label>' +
        '<button id="sf2-submit" type="submit">shadow登录</button></form>';
    })();
  </script>

  <script src="../common/protocol.js"></script>
  <script src="../common/fields.js"></script>
  <script src="../content/shadow.js"></script>
  <script src="../content/snapshot.js"></script>
  <script src="../content/locator.js"></script>
  <script src="../content/executor.js"></script>
  <script src="browser-test.js"></script>
</body>
</html>
