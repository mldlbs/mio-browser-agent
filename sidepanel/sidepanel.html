<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>mio</title>
  <style>
    :root {
      --base: #181825;
      --mantle: #1e1e2e;
      --crust: #11111b;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --overlay: #6c7086;
      --surface: #313244;
      --mauve: #cba6f7;
      --lavender: #b4befe;
      --teal: #94e2d5;
      --pink: #f5c2e7;
      --red: #f38ba8;
      --green: #a6e3a1;
      --radius: 14px;
      --ghost-grad: radial-gradient(120% 140% at 30% 10%, rgba(203,166,247,.35) 0%, rgba(203,166,247,.06) 55%, transparent 100%);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--base);
      color: var(--text);
      font-family: "Unbounded", "Sora", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    /* ambient ghost glow */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: var(--ghost-grad);
      pointer-events: none;
      z-index: 0;
    }
    /* drifting ghost mascot */
    .ghost {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
      opacity: .5;
      z-index: 0;
      animation: drift 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes drift {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .brand > div {
      min-width: 0;
    }
    .brand .name {
      font-weight: 700;
      letter-spacing: .06em;
      font-size: 15px;
      background: linear-gradient(120deg, var(--mauve), var(--lavender));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand .tagline {
      font-size: 10px;
      color: var(--overlay);
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-pill {
      flex: none;
    }
    #collapsePanel {
      flex: none;
    }

    .status-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--mantle);
      border: 1px solid var(--surface);
      color: var(--subtext);
    }
    .status-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--overlay);
      transition: background .3s;
    }
    .status-pill.running .dot { background: var(--teal); animation: pulse 1.4s infinite; }
    .status-pill.done .dot { background: var(--green); }
    .status-pill.error .dot { background: var(--red); }
    .sync-status { font-size: 11px; color: var(--overlay); min-height: 14px; margin-top: 6px; }
    .sync-status.ok { color: var(--green); }
    .sync-status.err { color: var(--red); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    #collapsePanel {
      flex: none;
      background: transparent;
      color: var(--overlay);
      border-color: var(--surface);
      padding: 4px 9px;
      font-size: 11px;
      border-radius: 999px;
    }
    #collapsePanel:hover { color: var(--lavender); border-color: rgba(180,190,254,.35); }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 14px 12px;
      min-height: 0;
    }

    /* input card */
    .compose {
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
    }
    .compose-templates {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .suggest-panel {
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      padding: 8px 10px;
    }
    .suggest-head {
      font-size: 11px;
      font-weight: 700;
      color: var(--lavender);
      letter-spacing: .05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .suggest-head .refresh {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--surface);
      border-radius: 6px;
      color: var(--overlay);
      padding: 1px 8px;
      font-size: 10px;
      cursor: pointer;
    }
    .suggest-head .refresh:hover { color: var(--text); border-color: var(--overlay); }
    .suggest-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--surface) transparent;
    }
    .suggest-task {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--surface);
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
      background: var(--crust);
    }
    .suggest-task:hover { border-color: var(--mauve); background: rgba(203,166,247,.06); }
    .suggest-task .icon { flex: none; font-size: 13px; }
    .suggest-task .label { font-size: 12px; color: var(--text); font-weight: 600; }
    .suggest-task .hint { font-size: 10px; color: var(--overlay); margin-top: 1px; }
    .suggest-task .badge {
      display: inline-block;
      margin-left: 6px;
      font-size: 9px;
      font-weight: 700;
      color: var(--mauve);
      border: 1px solid var(--mauve);
      border-radius: 999px;
      padding: 0 5px;
      vertical-align: 1px;
    }
    .suggest-empty { font-size: 11px; color: var(--overlay); padding: 4px 2px; }
    .template-chip {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: transparent;
      color: var(--teal);
      border-color: rgba(148,226,213,.35);
      cursor: pointer;
    }
    .template-chip:hover {
      background: rgba(148,226,213,.12);
    }
    .template-chip.custom {
      color: var(--yellow, #f9e2af);
      border-color: rgba(249,226,175,.35);
    }
    .template-chip.custom:hover {
      background: rgba(249,226,175,.12);
    }
    .template-wrap {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .template-wrap .template-chip {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }
    .template-share {
      padding: 3px 6px;
      font-size: 10px;
      border-radius: 0 999px 999px 0;
      background: transparent;
      color: var(--lavender);
      border-color: rgba(180,190,254,.35);
      cursor: pointer;
    }
    .template-share:hover { background: rgba(180,190,254,.12); }
    .template-import {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 999px;
      background: transparent;
      color: var(--pink);
      border-color: rgba(245,194,231,.35);
      cursor: pointer;
    }
    .template-import:hover { background: rgba(245,194,231,.12); }
    .history-share-template {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--pink);
      border-color: rgba(245,194,231,.35);
    }
    #goal {
      width: 100%;
      resize: none;
      min-height: 48px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
    }
    #goal::placeholder { color: var(--overlay); }
    .compose-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    #historyToggle {
      background: transparent;
      color: var(--lavender);
      border-color: rgba(180,190,254,.35);
    }
    button {
      font-family: inherit;
      font-size: 12px;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      border: 1px solid var(--surface);
      background: var(--surface);
      color: var(--text);
      transition: transform .15s ease, filter .15s ease, background .2s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.15); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    #start {
      flex: 1;
      border: none;
      background: linear-gradient(120deg, var(--mauve), var(--lavender));
      color: #1e1e2e;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(203,166,247,.25);
    }
    #start:disabled { background: var(--surface); color: var(--overlay); box-shadow: none; }
    #stop { background: transparent; color: var(--red); border-color: rgba(243,139,168,.35); }

    /* 更多菜单（渐进式披露：历史/定时收进下拉，保持首屏极简） */
    .more-menu { position: relative; flex: none; }
    #moreToggle {
      width: 44px;
      background: transparent;
      color: var(--subtext);
      border-color: var(--surface);
      font-size: 16px;
      line-height: 1;
      padding: 8px 0;
    }
    .more-popup {
      position: absolute;
      right: 0;
      bottom: calc(100% + 6px);
      z-index: 120;
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: 10px;
      padding: 6px;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .more-popup button {
      background: transparent;
      border: none;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text);
    }
    .more-popup button:hover { background: var(--surface); transform: none; filter: none; }
    .more-popup button.disabled { opacity: .5; cursor: not-allowed; }

    /* 模板行折叠：默认只露一个「模板」chip，展开后才显示全部模板 */
    .compose-templates { position: relative; }
    .compose-templates.collapsed .template-wrap,
    .compose-templates.collapsed .template-import { display: none; }
    #templatesToggle { display: inline-flex; }

    /* settings */
    details.settings {
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
    }
    summary {
      cursor: pointer;
      padding: 9px 12px;
      font-size: 12px;
      color: var(--subtext);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "⚙"; font-size: 12px; }
    details[open] summary { border-bottom: 1px solid var(--surface); }
    .settings-body { padding: 10px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    label { font-size: 11px; color: var(--subtext); display: block; margin-bottom: 3px; }
    input {
      width: 100%;
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 9px;
      outline: none;
    }
    input:focus { border-color: var(--mauve); box-shadow: 0 0 0 2px rgba(203,166,247,.15); }
    select {
      width: 100%;
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 9px;
      outline: none;
    }
    select:focus { border-color: var(--mauve); box-shadow: 0 0 0 2px rgba(203,166,247,.15); }
    #testConnection { background: transparent; color: var(--teal); border-color: rgba(148,226,213,.35); }
    #testConnection:disabled { opacity: .5; cursor: wait; }
    .settings-body .full { grid-column: 1 / -1; }
    .settings-body .group-label {
      grid-column: 1 / -1;
      font-size: 11px;
      font-weight: 700;
      color: var(--mauve);
      letter-spacing: .08em;
      margin-top: 2px;
    }
    .settings-body .vis-head { margin-top: 4px; padding-top: 8px; border-top: 1px dashed rgba(203,166,247,.25); color: var(--subtext); font-size: 12px; }
    /* 高级设置折叠块：视觉模型/云同步收进这里，基础配置保持紧凑 */
    details.advanced {
      grid-column: 1 / -1;
      border: 1px solid var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }
    details.advanced > summary {
      cursor: pointer;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--subtext);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.advanced > summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
    details.advanced[open] > summary { border-bottom: 1px solid var(--surface); }
    details.advanced[open] > summary::before { transform: rotate(90deg); }
    details.advanced > summary::-webkit-details-marker { display: none; }
    details.advanced .advanced-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      padding: 8px 10px;
    }
    /* details 未展开时内容必须隐藏——advanced-body 的 display:grid 不能覆盖 */
    details.advanced:not([open]) .advanced-body { display: none; }
    details.advanced .advanced-body .full { grid-column: 1 / -1; }
    #saveSettings {
      grid-column: 1 / -1;
      background: var(--mauve);
      color: #1e1e2e;
      border: none;
      font-weight: 600;
    }

    /* plan visualization */
    .plan-panel {
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      padding: 8px 10px;
    }
    .plan-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--mauve);
      letter-spacing: .05em;
      margin-bottom: 6px;
    }
    .plan-toggle {
      flex: none;
      background: transparent;
      border: 1px solid var(--surface);
      border-radius: 6px;
      color: var(--subtext);
      padding: 1px 8px;
      font-size: 10px;
      cursor: pointer;
      line-height: 1.5;
    }
    .plan-toggle:hover { color: var(--text); border-color: var(--overlay); }
    .plan-panel.collapsed { padding: 8px 10px; }
    .plan-panel.collapsed .plan-steps { display: none; }
    .plan-steps { display: flex; flex-direction: column; gap: 4px; }
    .plan-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--overlay);
      padding: 3px 6px;
      border-radius: 8px;
    }
    .plan-num {
      flex: none;
      width: 18px; height: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 10px;
      border: 1px solid var(--surface);
      background: var(--crust);
      color: var(--overlay);
    }
    .plan-step.done .plan-num { background: rgba(166,227,161,.15); border-color: rgba(166,227,161,.4); color: var(--green); }
    .plan-step.running { background: rgba(203,166,247,.07); color: var(--text); }
    .plan-step.running .plan-num { border-color: var(--mauve); color: var(--mauve); animation: pulse 1.4s infinite; }
    .plan-step.failed .plan-num { background: rgba(243,139,168,.15); border-color: rgba(243,139,168,.4); color: var(--red); }
    .plan-step.failed { color: var(--red); }
    .plan-step.failed { cursor: pointer; }
    .plan-step.failed:hover { background: rgba(243, 139, 168, 0.12); }
    .step-failure-detail { margin: 2px 0 6px 24px; padding: 6px 10px; background: rgba(243, 139, 168, 0.06); border-left: 2px solid #f38ba8; border-radius: 4px; font-size: 11px; line-height: 1.5; white-space: pre-wrap; color: #cdd6f4; }

    /* log */
    .log-wrap {
      flex: 1;
      min-height: 0;
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      padding: 8px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--surface) transparent;
    }
    .log-line {
      margin: 3px 6px;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--subtext);
      white-space: pre-wrap;
      word-break: break-all;
      animation: rise .3s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .log-line .tag { font-weight: 700; margin-right: 4px; }
    .log-line.t-user .tag { color: var(--lavender); }
    .log-line.t-step .tag { color: var(--teal); }
    .log-line.t-tool .tag { color: var(--mauve); }
    .log-line.t-finish .tag { color: var(--green); }
    .log-line.t-warn .tag, .log-line.t-error .tag { color: var(--red); }
    .log-line.t-plan .tag { color: var(--pink); }
    .log-line.t-llm .tag { color: var(--overlay); }
    .log-line.t-debug .tag { color: var(--overlay); opacity: .7; }
    .log-line.t-trace .tag { color: var(--teal); }
    .log-line.t-recover .tag { color: var(--pink); }

    /* recovery transparency event card */
    .recovery-event {
      margin: 4px 6px;
      padding: 8px 10px;
      background: linear-gradient(120deg, rgba(245,194,231,.08), rgba(245,194,231,.02));
      border: 1px solid rgba(245,194,231,.3);
      border-radius: 10px;
      animation: rise .3s ease;
    }
    .recovery-event pre {
      margin: 0;
      font-family: inherit;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--subtext);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* history view */
    .history-view {
      display: none;
      flex-direction: column;
      min-height: 0;
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .history-view.open { display: flex; flex: 1; }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mauve);
      border-bottom: 1px solid var(--surface);
    }
    .history-actions { display: flex; gap: 6px; }
    .history-actions button { padding: 5px 10px; font-size: 11px; border-radius: 8px; }
    #historyClear { background: transparent; color: var(--red); border-color: rgba(243,139,168,.35); }
    #historyStats { background: transparent; color: var(--pink); border-color: rgba(245,194,231,.35); }
    .stats-banner {
      margin: 8px 12px;
      padding: 9px 11px;
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 10px;
      font-size: 11px;
      color: var(--subtext);
      line-height: 1.6;
    }
    .stats-banner .stats-title { font-weight: 700; color: var(--pink); margin-bottom: 4px; }
    .stats-banner b { color: var(--text); }
    #historyClose { background: transparent; color: var(--overlay); }
    .history-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface) transparent;
    }
    .history-empty { color: var(--overlay); text-align: center; padding: 20px 0; font-size: 12px; }
    .history-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--surface);
    }
    .history-pager button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--overlay);
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
    }
    .history-pager button:disabled { opacity: 0.35; cursor: default; }
    .history-pager span { font-size: 11px; color: var(--overlay); min-width: 40px; text-align: center; }
    .history-item {
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }
    .history-item-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      column-gap: 8px;
      row-gap: 6px;
      padding: 9px 11px;
      cursor: pointer;
    }
    .history-item-head:hover { background: var(--surface); }
    .history-item-info { min-width: 0; flex: 1 1 150px; }
    .history-item-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      flex: none;
    }
    .history-goal {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-meta { font-size: 10.5px; color: var(--overlay); margin-top: 2px; word-break: break-word; }
    .history-status {
      flex: none;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--surface);
      color: var(--subtext);
    }
    .history-resume {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--green);
      border-color: rgba(166,227,161,.4);
    }
    .history-search {
      border: none;
      border-bottom: 1px solid var(--surface);
      border-radius: 0;
      padding: 8px 12px;
      background: var(--base);
    }
    .history-search::placeholder { color: var(--overlay); }
    .history-actions button { padding: 5px 10px; font-size: 11px; border-radius: 8px; }
    #historyExport { background: transparent; color: var(--teal); border-color: rgba(148,226,213,.35); }
    .history-pin {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--overlay);
      border-color: var(--surface);
    }
    .history-item.pinned .history-pin { color: var(--yellow, #f9e2af); border-color: rgba(249,226,175,.4); }
    .history-replay {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--mauve);
      border-color: rgba(203,166,247,.4);
    }
    .history-share {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--blue);
      border-color: rgba(138,173,244,.4);
    }
    .history-copy {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--teal);
      border-color: rgba(148,226,213,.4);
    }
    .history-template {
      flex: none;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 8px;
      background: transparent;
      color: var(--yellow, #f9e2af);
      border-color: rgba(249,226,175,.35);
    }
    .history-tags {
      padding: 0 11px 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .history-tag {
      font-size: 10px;
      color: var(--lavender);
      background: rgba(180,190,254,.08);
      border: 1px solid rgba(180,190,254,.25);
      border-radius: 999px;
      padding: 1px 8px;
    }
    .history-tag-add {
      font-size: 10px;
      color: var(--overlay);
      background: transparent;
      border: 1px dashed var(--surface);
      border-radius: 999px;
      padding: 1px 8px;
      cursor: pointer;
    }
    .history-item.s-done .history-status { color: var(--green); border-color: rgba(166,227,161,.35); }
    .history-item.s-error .history-status { color: var(--red); border-color: rgba(243,139,168,.35); }
    .history-item-body { display: none; }
    .history-item.open .history-item-body { display: block; }
    .history-summary {
      padding: 0 11px 8px;
      font-size: 11px;
      color: var(--teal);
      word-break: break-all;
    }
    .history-logs {
      border-top: 1px solid var(--surface);
      max-height: 220px;
      overflow-y: auto;
      background: var(--base);
      padding: 6px 0;
    }

    /* scheduled tasks view */
    .sched-toggle {
      background: transparent;
      color: var(--pink);
      border-color: rgba(245,194,231,.35);
    }
    .sched-view {
      display: none;
      flex-direction: column;
      min-height: 0;
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .sched-view.open { display: flex; }
    .sched-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mauve);
      border-bottom: 1px solid var(--surface);
    }
    .sched-head .sched-sub { font-size: 10px; font-weight: 400; color: var(--overlay); }
    #schedClose { padding: 4px 10px; font-size: 11px; background: transparent; color: var(--overlay); }
    .sched-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--surface);
      max-height: 320px;
      overflow-y: auto;
    }
    .sched-form .full { grid-column: 1 / -1; }
    .sched-form-row { flex-direction: column; gap: 3px; }
    /* display 留到 [hidden] 分支处理，避免覆盖 hidden 属性导致行常显 */
    .sched-form-row[hidden] { display: none; }
    .sched-form-row:not([hidden]) { display: flex; }
    .sched-form-row textarea {
      width: 100%;
      min-height: 46px;
      resize: none;
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 9px;
      outline: none;
    }
    .sched-form-row select {
      background: var(--crust);
      border: 1px solid var(--surface);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 7px 9px;
      outline: none;
    }
    .sched-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    .sched-actions button { padding: 7px 12px; font-size: 12px; }
    #schedAdd { background: var(--mauve); color: #1e1e2e; border: none; font-weight: 600; }
    #schedAddFromCompose { background: transparent; color: var(--lavender); border-color: rgba(180,190,254,.35); }
    .sched-list { max-height: 260px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .sched-empty { color: var(--overlay); text-align: center; padding: 14px 0; font-size: 12px; }
    .sched-item { background: var(--crust); border: 1px solid var(--surface); border-radius: 10px; padding: 9px 11px; }
    .sched-item.disabled { opacity: .6; }
    .sched-item-goal { font-size: 12px; color: var(--text); word-break: break-all; }
    .sched-item-meta { font-size: 10.5px; color: var(--overlay); margin-top: 3px; word-break: break-word; }
    .sched-item-meta .ok { color: var(--green); }
    .sched-item-meta .err { color: var(--red); }
    .sched-item-actions { display: flex; gap: 6px; margin-top: 7px; }
    .sched-item-actions button { padding: 3px 9px; font-size: 11px; border-radius: 8px; }
    .sched-run-now { background: transparent; color: var(--teal); border-color: rgba(148,226,213,.35); }
    .sched-toggle-btn { background: transparent; color: var(--yellow, #f9e2af); border-color: rgba(249,226,175,.4); }
    .sched-del { background: transparent; color: var(--red); border-color: rgba(243,139,168,.35); }

    /* onboarding */
    .onboard-mask {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(17,17,27,.86);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    /* 注意：必须保留 [hidden] 覆盖，否则 display:flex 会盖过 hidden 属性，
       遮罩永远显示并挡住整个侧边栏（引导页点击无反应）。 */
    .onboard-mask[hidden] { display: none; }
    .onboard-mask:not([hidden]) { display: flex; }
    .onboard-card {
      width: 100%;
      max-width: 340px;
      background: var(--mantle);
      border: 1px solid var(--surface);
      border-radius: 16px;
      padding: 18px 16px 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      animation: onboard-pop .25s ease;
    }
    @keyframes onboard-pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
    .onboard-steps { display: flex; flex-direction: column; gap: 6px; }
    .onboard-step {
      display: flex;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: all .2s;
    }
    .onboard-step.active {
      border-color: rgba(203,166,247,.4);
      background: rgba(203,166,247,.07);
    }
    .onboard-num {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      background: var(--surface);
      color: var(--overlay);
      border: 1px solid var(--surface);
    }
    .onboard-step.active .onboard-num {
      background: linear-gradient(120deg, var(--mauve), var(--lavender));
      color: #1e1e2e;
      border-color: transparent;
    }
    .onboard-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .onboard-text { font-size: 11.5px; color: var(--subtext); margin-top: 3px; line-height: 1.5; }
    .onboard-step:not(.active) .onboard-text { color: var(--overlay); }
    .onboard-dots { display: flex; gap: 6px; justify-content: center; margin: 10px 0 6px; }
    .onboard-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface); transition: all .2s; }
    .onboard-dot.active { background: var(--mauve); width: 18px; border-radius: 999px; }
    .onboard-actions { display: flex; gap: 8px; margin-top: 10px; }
    .onboard-actions button { flex: 1; padding: 9px 12px; font-size: 12px; border-radius: 10px; }
    .onboard-skip { background: transparent; color: var(--overlay); border-color: var(--surface); }
    .onboard-next { background: linear-gradient(120deg, var(--mauve), var(--lavender)); color: #1e1e2e; font-weight: 700; border: none; }
    .onboard-never { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--overlay); cursor: pointer; }
    .onboard-never input { width: auto; }

    footer {
      position: relative;
      z-index: 1;
      padding: 6px 14px 10px;
      font-size: 10px;
      color: var(--overlay);
      text-align: center;
      letter-spacing: .1em;
    }

    /* ── 自适应：侧边栏可被拖窄，窄宽度下收窄/单列化，避免横向溢出 ── */
    @media (max-width: 380px) {
      .settings-body { grid-template-columns: 1fr; }
      details.advanced .advanced-body { grid-template-columns: 1fr; }
      .sched-form { grid-template-columns: 1fr; }
      .compose-actions { flex-wrap: wrap; }
      .compose-actions #start { flex: 1 1 100%; }
      .history-item-actions { flex-wrap: wrap; }
      .onboard-card { max-width: 100%; }
    }
    @media (max-width: 300px) {
      header { gap: 6px; padding-left: 10px; padding-right: 10px; }
      .brand .tagline { display: none; }
      .status-pill span:not(.dot) { max-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }
    /* 历史面板操作按钮较多，窄宽度下允许头部换行、缩小按钮 */
    @media (max-width: 360px) {
      .history-head { flex-wrap: wrap; gap: 6px; }
      .history-actions { flex-wrap: wrap; }
      .history-actions button { padding: 4px 8px; font-size: 10px; }
      .history-item-head { align-items: flex-start; }
      .history-item-actions { max-width: 100%; }
    }
  </style>
</head>
<body>
  <svg class="ghost" viewBox="0 0 40 40" fill="none">
    <path d="M20 4C12 4 6 10 6 18v14c0 1.5 1.8 2.2 2.8 1L12 29l3 4 3-4 3 4 3-4 3 4 3-4 2.2 4c1 .2 2.8-.5 2.8-2V18C34 10 28 4 20 4Z" fill="rgba(203,166,247,.85)"/>
    <ellipse cx="16.4" cy="16.5" rx="1.8" ry="2.2" fill="#181825"/>
    <ellipse cx="23.6" cy="16.5" rx="1.8" ry="2.2" fill="#181825"/>
    <circle cx="16.4" cy="16.5" r="4.5" fill="rgba(24,24,37,.12)"/>
    <circle cx="23.6" cy="16.5" r="4.5" fill="rgba(24,24,37,.12)"/>
  </svg>

  <header>
    <div class="brand">
      <img src="../icon48.png" alt="mio">
      <div>
        <div class="name">mio</div>
        <div class="tagline">browser agent</div>
      </div>
    </div>
    <div class="status-pill" id="statusBox">
      <span class="dot"></span>
      <span id="status">idle</span>
    </div>
    <button id="collapsePanel" title="收起整个侧边栏（点击工具栏图标可重新打开）">收起</button>
  </header>

  <main>
    <section class="suggest-panel" id="suggestPanel" hidden>
      <div class="suggest-head">
        <span>本页可做</span>
        <button class="refresh" id="suggestRefresh" title="刷新页面任务推荐">刷新</button>
      </div>
      <div class="suggest-list" id="suggestList"></div>
    </section>

    <section class="compose">
      <div class="compose-templates" id="composeTemplates" hidden>
        <button id="templatesToggle" class="template-import" title="展开/收起模板">模板 ▸</button>
      </div>
      <textarea id="goal" placeholder="告诉 mio 你想做什么…&#10;例如：在搜索框输入 hello 并点击提交"></textarea>
      <div class="compose-actions">
        <button id="start">开始任务</button>
        <button id="stop">停止</button>
        <div class="more-menu">
          <button id="moreToggle" title="更多功能">⋯</button>
          <div class="more-popup" id="morePopup" hidden>
            <button id="historyToggle" title="查看历史任务记录">历史</button>
            <button id="schedToggle" title="配置定时/周期任务">⏰ 定时任务</button>
          </div>
        </div>
      </div>
    </section>

    <div class="sched-view" id="schedView" hidden>
      <div class="sched-head">
        <span>定时任务 <span class="sched-sub">浏览器打开时到点自动跑，无需手动开</span></span>
        <button id="schedClose" title="关闭">关闭</button>
      </div>
      <div class="sched-form">
        <div class="sched-form-row full"><label>任务目标</label><textarea id="schedGoal" placeholder="例如：打开 XX 网签到，确认签到成功并记录结果"></textarea></div>
        <div class="sched-form-row full"><label>目标网址（可选，填了会打开/复用到该站点）</label><input id="schedUrl" type="text" placeholder="https://example.com"></div>
        <div class="sched-form-row">
          <label>周期</label>
          <select id="schedFrequency">
            <option value="daily">每日</option>
            <option value="weekly">每周</option>
            <option value="interval">间隔</option>
          </select>
        </div>
        <div class="sched-form-row">
          <label>时间 (每日/每周)</label>
          <input id="schedTime" type="time" value="09:00">
        </div>
        <div class="sched-form-row" id="schedWeekdayRow" hidden>
          <label>星期</label>
          <select id="schedWeekday">
            <option value="0">周日</option><option value="1" selected>周一</option>
            <option value="2">周二</option><option value="3">周三</option>
            <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
          </select>
        </div>
        <div class="sched-form-row" id="schedIntervalRow" hidden>
          <label>间隔（分钟）</label>
          <input id="schedInterval" type="number" min="1" value="60">
        </div>
        <div class="sched-form-row full"><label>当前任务（可点击补全）</label><input id="schedGoalFromCompose" type="text" placeholder="使用下方输入框的目标…" readonly></div>
        <div class="sched-actions">
          <button id="schedAdd">添加定时任务</button>
          <button id="schedAddFromCompose">用当前目标添加</button>
        </div>
      </div>
      <div class="sched-list" id="schedList"></div>
    </div>

    <details class="settings">
      <summary>设置</summary>
      <div class="settings-body">
        <div class="full group-label">基础配置</div>
        <div><label>Provider</label><select id="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="zhipu">智谱 GLM</option>
          <option value="moonshot">月之暗面 Kimi</option>
          <option value="ollama">Ollama（本地）</option>
          <option value="lmstudio">LM Studio（本地）</option>
          <option value="custom">自定义</option>
        </select></div>
        <div><label>Model</label><input id="model" placeholder="gpt-4o-mini"></div>
        <div class="full"><label>Base URL</label><input id="baseUrl" placeholder="https://api.openai.com/v1"></div>
        <div class="full"><label>API Key <span style="font-weight:400;color:var(--overlay)">（本地模型可留空）</span></label><input id="apiKey" type="password" placeholder="sk-... 或本地模型留空"></div>
        <div><label>Max Steps</label><input id="maxSteps" type="number" value="30"></div>
        <div><label><input id="enableVision" type="checkbox" style="width:auto; vertical-align:middle"> Vision 兜底</label></div>
        <div class="full" style="display:flex; gap:8px">
          <button id="testConnection" style="flex:1">测试连接</button>
          <span id="testConnectionStatus" style="align-self:center; font-size:11px; color:var(--overlay)"></span>
        </div>
        <details class="advanced">
          <summary>高级设置</summary>
          <div class="advanced-body">
            <div class="full vis-head">视觉模型（独立配置，留空则复用上方模型）</div>
            <div><label>Vision Model</label><input id="visionModel" placeholder="glm-4v-flash"></div>
            <div><label>Vision Base URL</label><input id="visionBaseUrl" placeholder="https://open.bigmodel.cn/api/paas/v4"></div>
            <div class="full"><label>Vision API Key</label><input id="visionApiKey" type="password"></div>
            <div class="full vis-head">云同步（执行历史跨设备备份，端到端加密）</div>
            <div id="syncLoggedOut" class="full" style="display:none">
              <div style="margin-bottom:6px"><label>邮箱</label><input id="syncEmail" type="email" placeholder="you@example.com"></div>
              <div style="margin-bottom:6px"><label>密码</label><input id="syncPassword" type="password" placeholder="密码"></div>
              <div style="display:flex; gap:8px">
                <button id="syncRegister">注册</button>
                <button id="syncLogin">登录</button>
              </div>
              <div class="sync-status" id="syncFormStatus"></div>
            </div>
            <div id="syncLoggedIn" class="full" style="display:none">
              <div style="margin-bottom:6px; font-size:12px; color:var(--subtext)">账号: <span id="syncEmailDisplay"></span></div>
              <div style="display:flex; gap:8px">
                <button id="syncLogout">登出</button>
                <button id="syncNow" title="立即同步历史">立即同步</button>
              </div>
              <div class="sync-status" id="syncStatus"></div>
            </div>
          </div>
        </details>
        <button id="saveSettings">保存设置</button>
      </div>
    </details>

    <div class="history-view" id="historyView" hidden>
      <div class="history-head">
        <span>任务历史</span>
        <div class="history-actions">
          <button id="historyStats" title="失败分析：看看最近哪些环节最容易失败">失败分析</button>
          <button id="historyExport" title="导出 JSON">导出</button>
          <button id="historyImport" title="从 JSON 导入">导入</button>
          <button id="historyClear">清空</button>
          <button id="historyClose">关闭</button>
        </div>
      </div>
      <input id="historySearch" class="history-search" type="text" placeholder="搜索目标 / 摘要 / 标签…">
      <div class="history-list" id="historyList"></div>
      <div class="history-pager" id="historyPager" hidden>
        <button id="historyPrev" title="上一页">‹</button>
        <span id="historyPageInfo">1 / 1</span>
        <button id="historyNext" title="下一页">›</button>
      </div>
    </div>

    <div class="plan-panel" id="planPanel" hidden></div>

    <div class="log-wrap" id="log"></div>
  </main>

  <footer>mio <span id="version"></span> · 幽灵一般的浏览器助手</footer>

  <!-- 首次使用引导（onboarding）遮罩：纯 sidepanel 改动，不引入新权限 -->
  <div class="onboard-mask" id="onboardMask" hidden>
    <div class="onboard-card">
      <div class="onboard-steps">
        <div class="onboard-step" data-step="0">
          <div class="onboard-num">1</div>
          <div class="onboard-body">
            <div class="onboard-title">打开一个网站</div>
            <div class="onboard-text">随便逛逛任意网页，比如搜索页、博客、登录页。</div>
          </div>
        </div>
        <div class="onboard-step" data-step="1">
          <div class="onboard-num">2</div>
          <div class="onboard-body">
            <div class="onboard-title">看「本页可做」</div>
            <div class="onboard-text">页面顶部会自动出现能做的事——搜索、登录、提取表格…点一下就是任务。</div>
          </div>
        </div>
        <div class="onboard-step" data-step="2">
          <div class="onboard-num">3</div>
          <div class="onboard-body">
            <div class="onboard-title">开始任务</div>
            <div class="onboard-text">mio 会自己点击、输入、翻页，像幽灵一样替你把事办完。你只管等结果。</div>
          </div>
        </div>
      </div>
      <div class="onboard-dots" id="onboardDots"></div>
      <div class="onboard-actions">
        <button id="onboardSkip" class="onboard-skip">跳过</button>
        <button id="onboardNext" class="onboard-next">下一步</button>
      </div>
      <label class="onboard-never"><input type="checkbox" id="onboardNever"> 不再显示引导</label>
    </div>
  </div>

  <script src="../common/logger.js"></script>
  <script src="../common/protocol.js"></script>
  <script src="../common/storage.js"></script>
  <script src="../common/error-msg.js"></script>
  <script src="../common/sync-client.js"></script>
  <script src="../common/auth-client.js"></script>
  <script src="../common/history.js"></script>           
  <script src="../common/templates.js"></script>        
  <script src="../common/suggest.js"></script>
  <script src="../common/task-memory.js"></script>
  <script src="../common/scheduler.js"></script>
  <script src="recovery-events.js"></script>             
  <script src="vision.js"></script>
  <script src="../llm/adapter.js"></script>              
  <script src="../llm/openai.js"></script>               
  <script src="../llm/anthropic.js"></script>            
  <script src="../common/fields.js"></script>
  <script src="../tools/registry.js"></script>
  <script src="../tools/click.js"></script>
  <script src="../tools/type.js"></script>
